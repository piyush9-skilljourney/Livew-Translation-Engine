steps:
  # ── Step 1: Build the React Frontend ─────────────────────────────────────────
  - name: 'node:20'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        cd frontend
        npm install
        npm run build

  # ── Step 2: Sync static assets to Backend ────────────────────────────────────
  - name: 'bash'
    args:
      - '-c'
      - |
        mkdir -p backend/static
        cp -r frontend/dist/* backend/static/

  # ── Step 3: Build the Docker Image ──────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/bhashacast/app:$COMMIT_SHA'
      - 'backend'

  # ── Step 4: Push to Artifact Registry ────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/bhashacast/app:$COMMIT_SHA'

  # ── Step 5: Deploy to Cloud Run ─────────────────────────────────────────────
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'bhashacast'
      - '--image'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/bhashacast/app:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - 'SARVAM_API_KEY=${_SARVAM_API_KEY},MONGODB_URL=${_MONGODB_URL}'

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/bhashacast/app:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
